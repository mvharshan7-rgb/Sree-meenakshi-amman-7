<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4" id="mainBody">

    <div id="appContainer" class="w-full max-w-md bg-white p-8 rounded-xl shadow-2xl">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">🔒 Admin Controls</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Admin Username</label>
                <input type="text" id="username" class="w-full p-2 border rounded mt-1 text-black" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" class="w-full p-2 border rounded mt-1 text-black" required>
            </div>
            <button onclick="checkAdminLogin()" class="w-full bg-slate-900 text-white p-2 rounded font-bold hover:bg-slate-800 transition cursor-pointer">Verify Identity</button>
        </div>
        <a href="index.html" class="block text-center mt-4 text-sm text-gray-500 hover:underline">Back to Storefront</a>
    </div>

    <script>
        // Wrapping everything inside try-catch to capture errors
        function checkAdminLogin() {
            try {
                const userVal = document.getElementById('username').value.trim();
                const passVal = document.getElementById('password').value.trim();

                alert("Debug 1: Inputs collected -> Username: " + userVal + " | Password: " + passVal);

                if (userVal === "admin" && passVal === "mysecret123") {
                    alert("Debug 2: Password matched! Swapping HTML structure now...");

                    const container = document.getElementById('appContainer');
                    if (!container) {
                        alert("Error: appContainer element not found in HTML!");
                        return;
                    }

                    container.className = "bg-gray-50 w-full max-w-4xl p-6 rounded-xl shadow-md mt-6 self-start";
                    document.getElementById('mainBody').className = "bg-gray-100 min-h-screen p-4 flex justify-center";

                    container.innerHTML = `
                        <div class="flex justify-between items-center mb-8 bg-slate-900 text-white p-4 rounded-xl">
                            <h1 class="text-xl font-bold">Secure Upload Controls Active.</h1>
                            <button onclick="location.reload()" class="bg-red-500 px-3 py-1 rounded text-sm font-semibold cursor-pointer">Logout</button>
                        </div>

                        <div class="bg-white p-6 rounded-xl shadow border border-gray-200">
                            <h2 class="text-lg font-bold mb-4 border-b pb-2 text-gray-800">Upload New Product Listing</h2>
                            <form id="uploadForm" class="space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm text-gray-600 font-medium">Product Title *</label>
                                        <input type="text" id="prodTitle" class="w-full p-2 border rounded text-black" required>
                                    </div>
                                    <div>
                                        <label class="block text-sm text-gray-600 font-medium">Price (INR) *</label>
                                        <input type="number" id="prodPrice" class="w-full p-2 border rounded text-black" required>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600 font-medium">Description</label>
                                    <textarea id="prodDesc" class="w-full p-2 border rounded text-black" rows="3"></textarea>
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-600 font-medium">Image Direct Link * (Use Postimages Link)</label>
                                    <input type="text" id="prodImageLink" placeholder="https://i.postimg.cc/..." class="w-full p-2 border rounded text-black" required>
                                </div>
                                <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded font-bold hover:bg-green-700 transition w-full cursor-pointer">Publish Product to Database</button>
                            </form>
                        </div>
                    `;

                    alert("Debug 3: HTML swapped. Now loading Supabase script...");

                    // Initialize Supabase only inside to isolate initialization errors
                    const SUPABASE_URL = "https://mzwkuhtwzsuzwxuiujkk.supabase.co"; 
                    const SUPABASE_KEY = "sb_publishable_4GyLDREsM422Jl0sQYyxcQ_ykwCVYFz";
                    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

                    document.getElementById('uploadForm').addEventListener('submit', async (uploadEvent) => {
                        uploadEvent.preventDefault();
                        try {
                            const title = document.getElementById('prodTitle').value;
                            const price = document.getElementById('prodPrice').value;
                            const description = document.getElementById('prodDesc').value;
                            const image = document.getElementById('prodImageLink').value.trim();

                            const { data, error } = await supabaseClient
                                .from('products')
                                .insert([{ title, price, description, image }]);

                            if (error) {
                                alert("Database Error: " + error.message);
                            } else {
                                document.getElementById('uploadForm').reset();
                                alert("🎉 Product successfully published live on Cloud Database!");
                            }
                        } catch (uploadErr) {
                            alert("Upload Crash Error: " + uploadErr.message);
                        }
                    });

                } else {
                    alert("Access Denied! Wrong Username or Password.");
                }
            } catch (err) {
                // If anything crashes, it will show popup alert with exact reason
                alert("🔴 JAVASCRIPT CRASHED! Error Message: " + err.message);
            }
        }
    </script>
</body>
</html>
